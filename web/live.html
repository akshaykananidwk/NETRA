<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>કૃષ્ણ નેત્ર — લાઈવ</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js"></script>
</head>
<body class="gujarati">
<div id="kn-header"></div>

<main class="max-w-6xl mx-auto px-3 py-4 space-y-4" x-data="live()" x-init="init()">

  <div class="kn-card p-4">
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <h1 class="font-bold text-lg">📹 લાઈવ કેમેરા</h1>
      <select class="kn-input !w-auto" x-model.number="camId">
        <template x-for="c in cameras" :key="c.id">
          <option :value="c.id" x-text="c.name + (c.status==='online' ? ' 🟢' : ' 🔴')"></option>
        </template>
      </select>
    </div>
    <img :src="camId ? '/stream/'+camId+'?t='+bust : ''"
         class="w-full rounded-lg bg-slate-900" style="max-height:70vh;object-fit:contain">
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <div class="kn-card p-4 space-y-3">
      <h2 class="font-bold">🎙️ માઇક</h2>
      <div class="h-4 rounded-full overflow-hidden" style="background:#0f172a">
        <div class="h-full transition-all" style="background:linear-gradient(90deg,#1E88A8,#D4A017)"
             :style="'width:'+micLevel+'%'"></div>
      </div>
      <div class="text-sm text-slate-400">
        છેલ્લું સાંભળેલું:
        <span class="text-slate-200" x-text="lastHeard || '—'"></span>
        <span class="text-xs text-slate-500" x-show="lastConf"
              x-text="'(' + lastConf + '%)'"></span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button class="kn-btn kn-btn-ghost" @click="setState('mute_mic')">🔇 માઇક બંધ</button>
        <button class="kn-btn kn-btn-ghost" @click="setState('mute_speaker')">🔊 સ્પીકર બંધ</button>
        <button class="kn-btn kn-btn-ghost" @click="setState('paused')">⏸ થોભાવો</button>
        <button class="kn-btn" @click="setState('active')">▶ ચાલુ કરો</button>
      </div>
    </div>

    <div class="kn-card p-4 space-y-3">
      <h2 class="font-bold">🗣️ કૃષ્ણને કહો (લખીને કે બોલીને)</h2>
      <form @submit.prevent="sendCommand" class="flex gap-2">
        <input class="kn-input" placeholder="દા.ત. બે ચા મંગાવ" x-model="cmd"
               :disabled="cmdBusy">
        <button type="button" class="kn-btn shrink-0 text-lg"
                :class="recording ? 'kn-btn-red animate-pulse' : 'kn-btn-ghost'"
                @click="toggleRecord()" :disabled="cmdBusy"
                x-text="recording ? '⏹' : '🎙️'"></button>
        <button class="kn-btn kn-btn-gold shrink-0" :disabled="cmdBusy"
                x-text="cmdBusy ? '…' : 'મોકલો'"></button>
      </form>
      <p class="text-xs text-slate-500" x-show="!recording && !heard">
        🎙️ દબાવી બોલો, ⏹ દબાવો એટલે કૃષ્ણ સાંભળીને જવાબ આપશે
        (ફોનના માઇકથી પણ ચાલે).</p>
      <p class="text-xs" style="color:#fbbf24" x-show="micHint" x-text="micHint"></p>
      <div class="text-sm" x-show="heard" x-cloak>
        🗣️ સંભળાયું: <span class="text-slate-300" x-text="heard"></span>
      </div>
      <div x-show="cmdReply" x-cloak class="text-sm p-2 rounded kn-card"
           style="border-color:#1E88A855">
        🤖 <span x-text="cmdReply"></span>
        <div class="text-xs text-slate-500 mt-1" x-show="cmdMeta"
             x-text="cmdMeta"></div>
      </div>
      <h2 class="font-bold pt-2">👁️ તાજી ઓળખ</h2>
      <div class="space-y-1.5 max-h-48 overflow-y-auto text-sm">
        <template x-for="(e,i) in sightings" :key="i">
          <div class="flex gap-2 border-b border-slate-800 pb-1">
            <span x-text="e.icon"></span><span class="flex-1" x-text="e.text"></span>
            <span class="text-xs text-slate-500" x-text="e.time"></span>
          </div>
        </template>
        <div class="text-slate-500" x-show="!sightings.length">હજી કંઈ નથી</div>
      </div>
    </div>
  </div>
</main>

<script>
function live() {
  return {
    cameras: [], camId: null, bust: Date.now(), micLevel: 0,
    cmd: "", cmdBusy: false, cmdReply: "", cmdMeta: "",
    recording: false, recorder: null, heard: "", micHint: "",
    sightings: [], lastHeard: "", lastConf: null,
    async init() {
      await KN.init("live.html");
      this.cameras = await KN.api("/api/cameras").catch(() => []);
      const on = this.cameras.find(c => c.enabled);
      this.camId = on ? on.id : null;
      KN.on("mic.level", d => { this.micLevel = d.level || 0; });
      KN.on("speech.transcribed", d => {
        this.lastHeard = d.text;
        this.lastConf = d.confidence ? Math.round(d.confidence * 100) : null;
        this.log("🗣️", d.text);
      });
      KN.on("agent.speaking", d => this.log("🔊", d.text));
      const st = await KN.api("/api/system/status").catch(() => ({}));
      if (st.last_transcript) this.lastHeard = st.last_transcript.text;
      KN.on("face.recognized", d => this.log("🟢", `${d.name} ઓળખાયા (${Math.round((d.confidence||0)*100)}%)`));
      KN.on("face.uncertain", d => this.log("🟡", `કદાચ ${d.name}? (${Math.round((d.confidence||0)*100)}%)`));
      KN.on("face.unknown", d => this.log("🔴", `અજાણ્યો ચહેરો ${d.temp_uid}`));
    },
    log(icon, text) {
      this.sightings.unshift({ icon, text, time: new Date().toLocaleTimeString("gu-IN",
        { hour: "2-digit", minute: "2-digit" }) });
      this.sightings = this.sightings.slice(0, 30);
    },
    async setState(state) {
      try {
        await KN.api("/api/system/state", { method: "POST", json: { state } });
        KN.setPauseButton(state);
        KN.toast("સ્ટેટ બદલાયો: " + state, "ok");
      } catch (e) { KN.toast("ભૂલ: " + e.message, "error"); }
    },
    async toggleRecord() {
      if (this.recording) { this.recorder?.stop(); return; }
      if (!navigator.mediaDevices?.getUserMedia) {
        this.micHint = "⚠️ ફોન browser માં mic ફક્ત https/localhost પર ચાલે. "
          + "Chrome માં chrome://flags/#unsafely-treat-insecure-origin-as-secure "
          + "ખોલી આ સરનામું (http://" + location.host + ") ઉમેરી Enable કરો, "
          + "browser restart કરો. (PC પર localhost થી સીધું ચાલશે)";
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        this.recorder = new MediaRecorder(stream);
        this.recorder.ondataavailable = e => chunks.push(e.data);
        this.recorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          this.recording = false;
          const blob = new Blob(chunks, { type: this.recorder.mimeType });
          await this.sendVoice(blob);
        };
        this.recorder.start();
        this.recording = true;
        this.heard = ""; this.cmdReply = ""; this.micHint = "";
      } catch (e) {
        this.micHint = "માઇકની પરવાનગી ન મળી: " + e.message;
      }
    },
    async sendVoice(blob) {
      this.cmdBusy = true;
      try {
        const fd = new FormData();
        fd.append("audio", blob, "voice.webm");
        const r = await KN.api("/api/agent/voice", { method: "POST", body: fd });
        this.heard = r.heard;
        this.cmdReply = r.reply;
        this.cmdMeta = (r.tool_calls || []).map(t => t.name).join(", ")
          + (r.tool_calls?.length ? " · " : "") + r.provider
          + " · " + r.latency_ms + "ms";
        this.log("🎙️", r.heard);
        if (r.audio_url) new Audio(r.audio_url).play().catch(() => {});
      } catch (e) { KN.toast(e.message, "error", 5000); }
      this.cmdBusy = false;
    },
    async sendCommand() {
      if (!this.cmd || this.cmdBusy) return;
      const text = this.cmd;
      this.cmdBusy = true; this.cmdReply = ""; this.cmdMeta = "";
      this.log("⌨️", text);
      try {
        const r = await KN.api("/api/agent/command", { method: "POST",
          json: { text } });
        this.cmdReply = r.reply;
        this.cmdMeta = (r.tool_calls || []).map(t => t.name).join(", ")
          + (r.tool_calls?.length ? " · " : "") + r.provider
          + " · " + r.latency_ms + "ms";
        this.cmd = "";
      } catch (e) { KN.toast("ભૂલ: " + e.message, "error"); }
      this.cmdBusy = false;
    },
  };
}
</script>
</body>
</html>
